name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  quality:
    name: quality (node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint styles
        run: pnpm lint:style

      # 单测 + 覆盖率门禁：设计文档 12.4 要求共享包覆盖率 ≥ 80%，
      # 阈值写在 packages/*/vitest.config.ts 的 coverage.thresholds 里，低于阈值即失败。
      - name: Test + coverage gate (shared packages >= 80%)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # 设计文档 12.4「包体积预算」：预算常量在 scripts/check-bundle-size.ts，超预算即失败。
      - name: Bundle size budget
        run: pnpm size:check

      # 文档站构建也会做死链检查，链接写错即失败。
      - name: Docs build
        run: pnpm docs:build

  e2e:
    name: e2e (node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 浏览器包体大且版本由 lockfile 决定，按 lockfile 命中缓存即可。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # 真门禁：失败即失败，不加 continue-on-error。
      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
